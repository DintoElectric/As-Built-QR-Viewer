[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Function routes are matched before this SPA fallback, so /.netlify/functions/*
# still reaches the functions. This keeps the QR deep-link route /p/:slug working.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# These are public as-built drawings, but keep them out of search indexes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
