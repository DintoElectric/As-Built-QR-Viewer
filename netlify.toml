[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback for the QR deep-link route /p/:slug
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# These are public as-built drawings, but keep them out of search indexes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
